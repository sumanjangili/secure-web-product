[build]
  command = """
    cd frontend &&
    npm ci &&
    npm run build
  """
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_USE_YARN = "false"
  NPM_CONFIG_PRODUCTION = "false"

  # Ignore specific environment variable names that are not secrets
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,NODE_VERSION,CI,GITHUB_ACTIONS,NETLIFY"

  # Ignore paths containing .env files (ensure they are gitignored anyway)
  SECRETS_SCAN_OMIT_PATHS = ".env*,**/.env*,frontend/.env*"

[dev]
  # Single-process dev: Netlify proxies BOTH the Vite frontend and the functions.
  # `framework = "vite"` with no command made netlify dev run bare `vite` at the
  # repo root, where vite is not installed — hence "Failed running command: vite".
  command = "npm run dev:frontend"
  framework = "#custom"
  port = 9999          # the single URL used in the browser
  targetPort = 5173    # the Vite server Netlify proxies to
  autoLaunch = false

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # external_node_modules = ["pg", "argon2", "jsonwebtoken", "otplib", "@upstash/redis"]
  # included_files = ["netlify/functions/lib/**", "netlify/functions/node_modules/@upstash/**"]
  included_files = ["netlify/functions/lib/**"]

[[redirects]]
  from = "/api/github-webhook"
  to = "/.netlify/functions/github-webhook"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
