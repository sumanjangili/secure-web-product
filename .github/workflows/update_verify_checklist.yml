name: Update VERIFY_CHECKLIST

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  update-checklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install in frontend dir explicitly — don't use global working-directory
      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Run Lint & Tests
        id: lint_test
        run: |
          cd frontend
          npm run lint && npm run test
          echo "status=success" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Run Security Audit
        id: audit
        run: |
          cd frontend
          npm audit --production --audit-level=high
          echo "status=success" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # Now operate on VERIFY_CHECKLIST.md at REPO ROOT (correct location)
      - name: Prepare Checklist File
        id: prep
        run: |
          CHECKLIST_FILE="VERIFY_CHECKLIST.md"
          
          if [ ! -f "$CHECKLIST_FILE" ]; then
            cat > "$CHECKLIST_FILE" << 'CLDEOF'
          # Verification & Smoke-Test Checklist
          > **Auto-updated by CI**
          
          - [ ] <!-- Lint & tests passed -->
          - [ ] <!-- npm audit clean -->
          - [ ] <!-- MFA flow verified -->
          - [ ] <!-- Account erasure verified -->
          CLDEOF
          fi
          
          echo "file_content<<EOF" >> "$GITHUB_OUTPUT"
          cat "$CHECKLIST_FILE"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update Checklist Content
        run: |
          CHECKLIST_FILE="VERIFY_CHECKLIST.md"
          CONTENT="${{ steps.prep.outputs.file_content }}"
          
          # Use .outcome instead of .status
          if [[ "${{ steps.lint_test.outcome }}" == "success" ]]; then
            CONTENT=$(echo "$CONTENT" | sed 's/- \[ \] <!-- Lint & tests passed -->/- [x] <!-- Lint & tests passed -->/')
          else
            CONTENT=$(echo "$CONTENT" | sed 's/- \[x\] <!-- Lint & tests passed -->/- [ ] <!-- Lint & tests passed -->/')
          fi
          
          if [[ "${{ steps.audit.outcome }}" == "success" ]]; then
            CONTENT=$(echo "$CONTENT" | sed 's/- \[ \] <!-- npm audit clean -->/- [x] <!-- npm audit clean -->/')
          else
            CONTENT=$(echo "$CONTENT" | sed 's/- \[x\] <!-- npm audit clean -->/- [ ] <!-- npm audit clean -->/')
          fi
          
          echo "$CONTENT" > "$CHECKLIST_FILE"

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update VERIFY_CHECKLIST: Lint=${{ steps.lint_test.outcome }}, Audit=${{ steps.audit.outcome }}"
          file_pattern: VERIFY_CHECKLIST.md
