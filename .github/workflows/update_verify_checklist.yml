name: Update VERIFY_CHECKLIST

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERIFY_CHECKLIST.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-checklist
  cancel-in-progress: false

jobs:
  update-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          token: ${{ secrets.CHECKLIST_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            netlify/functions/package-lock.json

      - name: Install dependencies (root)
        run: npm ci
      - name: Install dependencies (frontend)
        run: npm ci --prefix frontend
      - name: Install dependencies (functions)
        run: npm ci --prefix netlify/functions

      # Re-run the SAME gate as CI; continue-on-error lets us record
      # failures honestly in the checklist instead of dying.
      - name: Gate — lint, type-check, tests
        id: gate_lint_tests
        continue-on-error: true
        run: npm run lint && npm run type-check && npm run test

      - name: Gate — dependency audit (moderate)
        id: gate_audit
        continue-on-error: true
        run: npm run audit

      - name: Update VERIFY_CHECKLIST.md
        env:
          GATE_LINT_TESTS: ${{ steps.gate_lint_tests.outcome }}
          GATE_AUDIT: ${{ steps.gate_audit.outcome }}
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re

          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          outcomes = {
              "lint-tests": os.environ.get("GATE_LINT_TESTS", ""),
              "audit": os.environ.get("GATE_AUDIT", ""),
          }

          path = pathlib.Path("VERIFY_CHECKLIST.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          changed = 0

          for i, line in enumerate(lines):
              m = re.search(r"<!--\s*gate:(lint-tests|audit)\b", line)
              if not m:
                  continue
              key = m.group(1)
              ok = outcomes.get(key) == "success"
              box = "[x]" if ok else "[ ]"
              verb = "passed" if ok else "FAILED"
              lines[i] = re.sub(
                  r"- \[[ x]\]\s*<!--\s*gate:.*?-->",
                  f"- [{box}] <!-- gate:{key} · {verb} {stamp} -->",
                  line,
                  count=1,
              )
              changed += 1

          if changed == 0:
              raise SystemExit(
                  "No gate rows found — expected '<!-- gate:lint-tests -->' and "
                  "'<!-- gate:audit -->' anchors in VERIFY_CHECKLIST.md"
              )

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Updated {changed} gate rows: {outcomes}")
          PY

      - name: Commit and push checklist
        uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.CHECKLIST_TOKEN }}
        with:
          commit_message: "chore(checklist): auto-update gate rows [skip ci]"
          file_pattern: VERIFY_CHECKLIST.md
