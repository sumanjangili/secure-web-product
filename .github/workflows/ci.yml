name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  issues: none

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Node setup ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ---------- Install deps ----------
      - name: Install dependencies
        run: npm ci

      # ---------- Verify scripts exist ----------
      # FIX: Fail fast with a clear message if scripts are missing
      - name: Verify npm scripts exist
        run: |
          echo "Checking required scripts in package.json..."
          for script in lint type-check test build; do
            if ! npm run --silent | grep -q "\b${script}\b"; then
              echo "::error::Missing npm script: '${script}'"
              echo "::error::Add this to frontend/package.json scripts:"
              echo "::error::  \"${script}\": \"<command>\""
              exit 1
            fi
            echo "✅ Found script: ${script}"
          done

      # ---------- Lint ----------
      - name: Run ESLint
        run: npm run lint

      # ---------- Type checking ----------
      - name: Run TypeScript compiler
        run: npm run type-check

      # ---------- Unit tests ----------
      - name: Run Vitest
        run: npm run test

      # ---------- Build ----------
      - name: Build production bundle
        run: npm run build

      # ---------- Security Audit ----------
      - name: Run Security Audit
        run: npm audit --production --audit-level=high
        continue-on-error: true

      # ---------- Deploy preview ----------
      - name: Deploy to Netlify (preview)
        if: github.event_name == 'pull_request'
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./frontend/dist
          production-deploy: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
