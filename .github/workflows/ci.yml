name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  issues: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate — lint · types · tests · build · audit · secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth:0

      # ---------- Node setup (engines: >=22.0.0, stack targets >=22.13.0) ----------
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            netlify/functions/package-lock.json

      # ---------- Install all three packages ----------
      - name: Install dependencies (root)
        run: npm ci
      - name: Install dependencies (frontend)
        run: npm ci --prefix frontend
      - name: Install dependencies (functions)
        run: npm ci --prefix netlify/functions

      # ---------- Fail fast if the root manifest wiring regresses ----------
      - name: Verify root manifest scripts exist
        run: |
          echo "Checking required scripts in ROOT package.json..."
          for script in lint type-check test build audit; do
            if ! npm run --silent | grep -qw "${script}"; then
              echo "::error::Missing npm script: '${script}' in root package.json"
              exit 1
            fi
            echo "✅ Found script: ${script}"
          done

      # ---------- The gate: mirrors the verified local run exactly ----------
      - name: Lint (frontend + functions)
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Tests (frontend suite + functions wiring proof)
        run: npm run test

      - name: Production build (incl. CSP nonce generation)
        run: npm run build

      - name: Dependency audit gate (moderate, both packages)
        run: npm run audit

      # ---------- Secret scanning (closes checklist row 5) ----------
      # Individual-account repos are covered by the free Gitleaks license.
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Deploy preview ----------
      - name: Deploy to Netlify (preview)
        if: github.event_name == 'pull_request'
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./frontend/dist
          production-deploy: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
